version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting Docker login"

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t sharans1903-a11y/backend:latest .

  post_build:
    commands:
      - echo "Pushing Docker image"
      - docker push sharans1903-a11y/backend:latest
      - printf '[{"name":"backend-container","imageUri":"docker.io/sharans1903-a11y/backend:latest"}]' > imagedefinition.json

artifacts:
  files:
    - imagedefinition.json
